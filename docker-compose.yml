services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: wellpath
      POSTGRES_USER: wellpath
      POSTGRES_PASSWORD: wellpath_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellpath -d wellpath"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - wellpath_postgres_data:/var/lib/postgresql/data

volumes:
  wellpath_postgres_data:
